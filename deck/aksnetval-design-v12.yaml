      TS1은 HPA가 1분에 1개씩만 줄어드는지, TS2는 줄어든 뒤 영역 분포를 기록하고, TS3은 축소 때 실제로 지워진 Pod가 ReplicaSet 삭제 규칙으로 예측한 Pod와 같은지 판정해요. TS2는 Pod 2개라 한 영역이 비는 게 당연해서 기록용 INFO입니다. TS4는 CAS가 세 영역을 고르게 늘리는지, TS5는 PRD 권장 강제 분산을 넣어도 CAS와 함께 동작하는지입니다. TS6은 영역별 풀에 고정한 Deployment 세 개를 함께 줄여도 영역마다 하나 이상 남는지 5초마다 확인해요.
      아래 상자처럼 vm-mgmt에서 5초 간격으로 기록하고, 15분 안에 Pending이 남거나 감소 폭과 간격이 어긋나면 FAIL입니다. 예를 들어 HPA가 한 번에 2개를 줄이거나 50초 만에 다음 축소가 나오면 behavior 정책이 안 먹은 거라 FAIL로 처리하죠. 반대로 공식 문서가 보장하지 않는 축소 순서 같은 동작은 PASS, FAIL을 매기지 않고 기록만 남깁니다. 표의 마지막 열이 그 구분이에요. 그럼 TS1과 TS4 설계를 다음 장에서 그림으로 보겠습니다.
    source: |
