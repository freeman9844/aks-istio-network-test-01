# 검증에 쓰는 네임스페이스 4개
#   web    : 1계층 웹(web-a, web-b). Istio 사이드카 주입 대상
#   app    : 2계층 BFF(bff-a, bff-b). Istio 사이드카 주입 대상
#   nomesh : 사이드카가 없는 클라이언트(probe). STRICT mTLS 가 평문을 막는지 확인(TN9)
#   scale  : HPA·Cluster Autoscaler 검증(TS1~TS5). 메시와 무관
# web·app 의 사이드카 주입 레이블(istio.io/rev)은 02-apply.ps1 이 설치된 Istio 리비전(예: asm-1-30)으로 붙인다.
# 리비전 이름은 클러스터·업그레이드 시점마다 달라지므로 여기서 고정하지 않는다.
apiVersion: v1
kind: Namespace
metadata:
  name: web
---
apiVersion: v1
kind: Namespace
metadata:
  name: app
---
apiVersion: v1
kind: Namespace
metadata:
  name: nomesh
---
apiVersion: v1
kind: Namespace
metadata:
  name: scale
