          - ["TN11", "web-a", "Blob PE 10.50.2.4", "TLS 실패", "deny-web-to-data (web 네임스페이스)", "TN12"]
          - ["TN12·TN16", "bff-b / bff-a", "자기 PE (10.50.2.4 / .5)", "TLS 성공", "allow-bff-b-to-blob / allow-bff-a-to-blob2", "—"]
          - ["TN13", "kubelet", "web·bff readinessProbe", "rewrite 후 Ready", "Istio probe rewrite (STRICT mTLS)", "—"]
          - ["TN14", "vm-mgmt + 로컬", "API 서버 :443", "사설 IP · 로컬 불가", "Private Cluster · 공용 FQDN 끔", "readyz"]
          - ["TN15·TN17", "bff-a / bff-b", "남의 PE (10.50.2.4 / .5)", "TLS 실패", "app-egress-default except 10.50.2.0/24", "TN12 · TN16"]
          - ["TN18~TN20", "bff-b", "CoreDNS · istiod :15021 · mcr", "해석 · 200 · 연결", "기본 egress 유지 (TN19는 정책 후 기동 Pod만)", "—"]
          - ["TN21·TN22", "bff-b", "자기·다른 노드 :10250", "연결 (≠000)", "기본 egress 유지 (노드)", "probe"]
    notes: |
      앞 장 그림의 네트워크 경로를 검증 ID 단위로 정리한 표입니다. vm-mgmt 안의 스크립트가 이 순서대로 실행하고, 판정은 Python이 자동으로 PASS, FAIL, INCONCLUSIVE를 매깁니다.
      위쪽 TN1부터 TN4까지는 NSG예요. TN1은 vm-appgw-sim에서 Ingress LB로 200, TN2는 vm-other에서 시간 초과가 나와야 하죠. 그런데 VM이 고장 나도 시간 초과가 나오거든요. 그래서 같은 VM에서 PE로 TLS가 되는지 보는 TN3을 대조군으로 붙였습니다. TN5부터 TN10까지는 Istio로, 자기 BFF는 200, 남의 BFF와 Ingress 우회는 403, 사이드카 없는 Pod는 연결 실패입니다.
      표 가운데 TN11부터 TN20까지가 Linux판에서 바뀐 곳인데요. TN11은 web에서 PE로 가는 차단이고요. TN12와 TN16은 bff마다 자기 전용 PE만 TLS 성공이고, TN15와 TN17은 남의 PE라 실패가 기대값입니다. 이렇게 막으면 다른 통신까지 끊기지 않을까 걱정되잖아요. 그래서 TN18부터 TN20까지 CoreDNS, istiod, 인터넷 연결이 그대로인지, TN21과 TN22으로 노드로 가는 연결도 그대로인지 함께 봅니다.
      아래쪽 TN13은 STRICT mTLS에서 readinessProbe가 살아 있는지, 마지막 TN14는 Private Cluster 확인입니다. 스케일링 항목인 TS1과 TS4는 두 번째 파트에서 따로 다룹니다. 차단 테스트에는 모두 허용 대조군이 있고 대조군이 실패하면 INCONCLUSIVE라는 점, 기억해 주세요. 그럼 실제 결과를 다음 장에서 보겠습니다.
    source: |
