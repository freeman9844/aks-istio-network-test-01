# web 네임스페이스에서 Private Endpoint 서브넷(snet-pe 10.50.2.0/24)으로 나가는 트래픽만 차단한다.
# 웹 계층이 데이터 계층(Blob PE 10.50.2.4)에 직접 접근하지 못하게 하는 3계층 분리 통제다(TN11).
# AKS 의 Cilium 데이터플레인이 적용하며, Istio 사이드카를 거쳐 나가는 트래픽에도 적용된다.
# 이 정책을 지우면 TN11 만 FAIL(400) 로 바뀌는 것으로 이 정책이 실제 차단 요인임을 확인했다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-web-to-data
  namespace: web
spec:
  podSelector: {}                  # web 네임스페이스의 모든 Pod
  policyTypes:
    - Egress                       # 나가는 방향만 제한. 들어오는 방향(Ingress)은 제한하지 않는다
  # Egress 를 지정하면 아래 규칙에 맞는 목적지만 허용된다
  egress:
    # 규칙 1: 클러스터 안의 모든 Pod 허용(CoreDNS, istiod, bff 등)
    - to:
        - namespaceSelector: {}
    # 규칙 2: 클러스터 밖은 모두 허용하되 PE 서브넷만 제외
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.50.2.0/24       # snet-pe. 이 대역만 차단된다
