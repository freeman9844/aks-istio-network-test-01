    notes: |
      앞 장이 기본 스케일링이었다면, 이번 장은 PRD 검토용 YAML에서 가져온 두 가지 결과입니다.
      왼쪽 TS5부터 볼게요. zone-spread에 PRD YAML과 같은 영역 강제 분산, 그러니까 DoNotSchedule과 minDomains 3, nodeTaintsPolicy Honor를 넣었어요. 그리고 노드가 영역마다 한 대인 상태에서 6개로 늘렸습니다. CAS가 세 영역 풀을 한 대씩 늘려 노드가 2, 2, 2가 됐고, 110초 만에 Pod 2, 2, 2로 6개 모두 Running, Pending은 없었습니다. 이벤트는 이번에도 userz2와 userz1 두 건만 남아서, 판정은 Pod와 노드 수로만 했어요.
      오른쪽은 축소 뒤 영역 분포입니다. TS2는 hpa-demo를 2개로 줄인 결과로 1, 2, 2에서 0, 1, 1이 됐는데요. Pod 2개에 영역 3개니까 한 영역이 비는 건 당연하고 차이 1이라 maxSkew 1도 만족합니다. 그래서 기록용 INFO고요, 진짜 질문은 영역 수만큼 남기면 영역마다 하나씩 남느냐였죠. TS3에서는 minReplicas 3으로 5개, 9개, 12개에서 3개로 줄이는 걸 각각 두 번씩 했고, 여섯 번 모두 1, 1, 1이 됐습니다. 지워진 Pod 34개를 Pod 감시로 기록해서 ReplicaSet 삭제 규칙 예측과 비교했더니 모두 일치했어요. 11월 22일 재테스트 결과인데, 같은 시각·같은 구간이라 후보가 여러 개인 경우가 20건, 한 번에 2개가 지워진 경우가 1회 있었고 모두 규칙으로 설명됩니다. 영역마다 노드가 한 대라서, 같은 노드에 Pod가 많은 쪽부터 지우는 규칙이 적용돼 1, 1, 1로 끝난 겁니다. 분산 제약은 새 Pod 배치에만 쓰이므로, 영역에 노드가 여러 대이거나 한 번에 여러 개를 줄이면 축소 뒤 영역 균등 배치는 보장되지 않습니다.
      그럼 이 한계를 영역별 Deployment로 넘을 수 있는지, TS6 결과를 보겠습니다.
