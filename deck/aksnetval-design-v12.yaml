    notes: |
      앞 장에서 hpa-demo 하나로는 축소 뒤 영역마다 하나씩 남는다는 보장이 없다고 말씀드렸죠. 그럼 그 요건을 꼭 지켜야 할 때는 어떻게 하느냐, 그 답을 실측한 게 이번 TS6입니다.
      왼쪽 그림부터 볼게요. 영역 1, 2, 3에 고정된 사용자 풀 userz1, userz2, userz3마다 Deployment를 하나씩 두고, nodeSelector로 그 풀에만 뜨게 했어요. 그리고 Deployment마다 HPA를 따로 붙여 minReplicas를 1로 둡니다. 이렇게 하면 각 HPA의 최소값 1이 곧 영역별 최소 1개가 되는 거죠. 축소 정책은 hpa-demo와 같은 1분에 1개입니다.
      오른쪽 표가 실측입니다. 세 Deployment를 3개씩, 4개씩 올린 뒤 minReplicas 1로 줄이는 걸 각각 두 번 했고, 5초마다 영역별 Running Pod를 셌어요. 네 번 모두 3, 3, 3에서 2, 2, 2를 거쳐 1, 1, 1로, 또는 4, 4, 4에서 한 단계씩 1, 1, 1까지 줄었습니다. 표본 334개 중 어느 영역도 0이 된 순간이 없었고, 다른 영역 노드에 뜬 Pod도 없었어요.
      다만 아래 상자의 트레이드오프를 꼭 보셔야 합니다. HPA가 영역마다 따로 돌기 때문에 한 영역에만 부하가 몰려도 그 영역만 늘고, 영역 간 부하 분산은 해 주지 않습니다. 최소 Pod 수도 3의 배수가 되고, Service는 공통 라벨로 세 Deployment를 묶어야 하죠. 그래서 영역당 최소 1개가 꼭 필요한 워크로드에만 쓰는 걸 권합니다. 그럼 스케일링 결과 전체를 정리하겠습니다.
    source: |
