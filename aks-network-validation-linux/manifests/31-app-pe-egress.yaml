# app 네임스페이스의 Private Endpoint egress 를 워크로드별로 나눈다(Linux 판 전용, TN12·TN15~TN20).
#   bff-b → Blob PE(staksnetval…,  10.50.2.4) 만 허용
#   bff-a → Blob PE(staksnetvalb…, 10.50.2.5) 만 허용
# 표준 NetworkPolicy 는 허용 규칙의 합집합이다. Pod 에 정책이 하나라도 걸리면 어느 정책에서든 허용된 목적지만 나갈 수 있다.
#   ① app-egress-default : 모든 Pod 에 기본 egress(클러스터 내부 + PE 서브넷을 뺀 외부)를 허용한다
#   ② allow-bff-*        : 해당 Pod 에만 자기 PE IP /32:443 을 더한다
# 그래서 PE 이외의 기본 egress(CoreDNS, istiod xDS·인증서, 인터넷·Entra ID 등)는 막히지 않는다(TN18~TN20).
#   ③ app-egress-nodes   : 노드(host·remote-node)로 가는 egress 를 연다(TN21·TN22). 아래 설명 참고
# PE IP 는 01-infra.sh 가 고정 IP 로 만든다(config.sh BLOB_PE_IP·BLOB2_PE_IP). 바꾸면 이 파일도 같이 바꾼다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-egress-default
  namespace: app
spec:
  podSelector: {}                  # app 네임스페이스의 모든 Pod
  policyTypes:
    - Egress                       # 나가는 방향만 제한. Ingress 는 Istio AuthorizationPolicy 가 담당
  egress:
    # 규칙 1: 클러스터 안의 모든 Pod 허용(CoreDNS, istiod, 다른 서비스)
    - to:
        - namespaceSelector: {}
    # 규칙 2: 클러스터 밖은 모두 허용하되 PE 서브넷(snet-pe)만 제외
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.50.2.0/24
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-bff-b-to-blob
  namespace: app
spec:
  podSelector:
    matchLabels:
      app: bff-b
  policyTypes:
    - Egress
  egress:
    # ①에서 제외한 PE 서브넷 중 Blob PE 한 개(HTTPS)만 bff-b 에 다시 연다
    - to:
        - ipBlock:
            cidr: 10.50.2.4/32
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-bff-a-to-blob2
  namespace: app
spec:
  podSelector:
    matchLabels:
      app: bff-a
  policyTypes:
    - Egress
  egress:
    # bff-a 는 두 번째 Storage 의 Blob PE 만 연다. bff-b 의 PE(10.50.2.4)는 열지 않는다
    - to:
        - ipBlock:
            cidr: 10.50.2.5/32
      ports:
        - protocol: TCP
          port: 443
---
# ③ 노드 egress 보완(Cilium 전용). AKS Azure CNI powered by Cilium 은 기본 설정(policy-cidr-match-mode 미설정)에서
#    표준 NetworkPolicy 의 ipBlock 을 Pod·노드 IP 에 매칭하지 않는다. 그래서 ①의 0.0.0.0/0 이 있어도
#    노드 IP(kubelet, hostNetwork Pod, NodePort 등)로 나가는 연결이 막힌다. 실측: ipBlock 10.50.4.0/24 를 더해도 000,
#    아래 정책을 더하면 401(연결 성공). host = Pod 가 있는 노드, remote-node = 다른 노드
#    https://docs.cilium.io/en/stable/network/kubernetes/policy/
# 허용 규칙의 합집합이므로 ①·② 와 함께 적용된다. 포트를 좁히려면 toPorts 를 더한다
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: app-egress-nodes
  namespace: app
spec:
  endpointSelector: {}             # app 네임스페이스의 모든 Pod
  egress:
    - toEntities:
        - host
        - remote-node