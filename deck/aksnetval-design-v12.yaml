      - type: callout
        id: negative
        box: [40, 590, 1200, 82]
        text: "실행 위치: vm-mgmt → Private API 경유 kubectl exec · VM curl은 run-command · 표는 network 재실행 결과(전체 실행과 판정 동일)<br>판정 원칙: curl이 실제로 실행됐을 때만 000을 차단으로 인정 · DNS가 기대 PE IP일 때만 TN11·TN12 판정 · 대조군 실패 시 INCONCLUSIVE"
    notes: |
      앞 장 매트릭스를 koreacentral의 Private AKS에 올려서, vm-mgmt 안에서 자동 판정한 표인데요. TN1부터 TN12까지 대조군 TN3을 포함한 12건과 TN13까지 13건이 모두 PASS였습니다. 표는 network 항목만 다시 돌린 재실행 결과이고, 전체 실행과 판정이 같습니다.
      먼저 NSG를 보면, TN1은 vm-appgw-sim에서 내부 LB로 200이 나왔고, TN2는 vm-other에서 curl 종료 코드 28, 그러니까 시간 초과로 막혔습니다. 같은 VM에서 Blob PE로 TLS 연결이 되는 TN3이 통과했으니까, 이 차단이 VM 고장이 아니라 NSG 때문이라고 말할 수 있죠. TN4는 snet-ingress에 Deny가 있는데도 200이라서, LB IP 서브넷 NSG는 효과가 없다는 게 다시 확인됐습니다.
      Istio 쪽은 자기 BFF가 200, 교차 호출과 우회 호출이 403이었고, 사이드카 없는 probe는 종료 코드 56, 연결 리셋으로 끊겼습니다.
      TN11과 TN12는 같이 보셔야 하는데요. 두 Pod 모두 Blob 이름이 PE IP 10.50.2.4로 해석된 걸 먼저 확인했어요. 그다음 web-a에서는 TLS가 실패, bff-b에서는 성공했습니다. Linux판에서는 이 PE가 bff-b 전용이라 출발지가 bff-b로 바뀌었어요. TN13은 STRICT mTLS에서도 probe가 15020 포트로 rewrite되어 네 개 모두 Ready였습니다. 그럼 이 13건을 구성도 위에 올려서 경로별로 다시 보겠습니다.
    source: |
