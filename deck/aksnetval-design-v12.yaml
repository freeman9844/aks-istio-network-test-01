          - {kind: text, name: r-box-t, x: 835, y: 298, w: 360, h: 254, text: "실측: private=True · publicFqdn=False\nvm-mgmt 해석 10.50.4.4 · /readyz = ok\n로컬 = NXDOMAIN / 접속 실패\n\n판정 순서\nFAIL: 비공개 아님 · 공용 FQDN 켜짐 ·\n사설 IP가 snet-aks-app 밖\nINCONCLUSIVE: 대조군 readyz 실패 ·\n로컬 접속 성공 (VPN·피어링)\nPASS: 나머지 조건 모두 기대대로\n\n로컬 확인은 verify 뒤 run.sh가 수행해 합침", size: 11, color: "171717", align: left, valign: top}
    notes: |
      앞에서 TN12의 출발지가 bff-b로 바뀌었다고 말씀드렸는데요, 이번 장이 그 이유입니다. Linux판에서 새로 넣은 통제가 두 가지인데, 왼쪽이 PE egress 분리, 오른쪽이 API 서버 비공개입니다.
      왼쪽 위 정책 세 개부터 볼게요. 표준 NetworkPolicy는 허용 규칙의 합집합이라서, Pod에 정책이 하나라도 걸리면 어느 정책이든 허용한 곳만 나갈 수 있거든요. 그래서 공통 정책 app-egress-default는 클러스터 내부와 0.0.0.0/0을 열되 PE 서브넷 10.50.2.0/24만 뺐어요. 그리고 bff-b에는 10.50.2.4/32, bff-a에는 10.50.2.5/32의 443만 다시 열었습니다.
      가운데 격자가 결과입니다. bff-a는 Blob2만, bff-b는 Blob만 TLS가 성공했고, 서로 바뀐 TN15와 TN17은 종료 코드 28로 막혔습니다. 막는 바람에 다른 통신이 끊기면 안 되잖아요. 그래서 아래 TN18부터 TN20까지 CoreDNS 해석, istiod 15021 ready, 인터넷 mcr 연결이 모두 정상인 걸 확인했습니다. 다만 TN19는 Pod가 정책보다 먼저 떠 있었다면 근거가 안 돼서, 정책 이후 기동한 경우만 인정합니다.
      그런데 노드로 가는 TN21, TN22에서 하나 발견했어요. 0.0.0.0/0을 열었는데도 bff-b에서 노드 kubelet으로는 000이 나왔습니다. 정책이 없는 probe는 401로 붙었으니 정책 때문인 거죠. Cilium은 기본값에서 ipBlock을 Pod나 노드 IP에 매칭하지 않거든요. 노드 대역을 ipBlock으로 더해도 그대로였고, CiliumNetworkPolicy로 host와 remote-node 엔터티를 열자 401로 붙었습니다. 그래서 네 번째 정책으로 넣었어요.
      오른쪽 TN14는 vm-mgmt에서는 API 서버가 사설 IP 10.50.4.4로 해석되고 readyz가 ok, 로컬에서는 NXDOMAIN이라 PASS입니다. 그럼 네트워크 결과를 PRD 관점으로 정리해 보겠습니다.
    source: |
      매니페스트: aks-network-validation-linux/manifests/31-app-pe-egress.yaml
