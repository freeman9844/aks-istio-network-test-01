    notes: |
      스케일링 파트를 PRD 관점으로 정리하면 표의 다섯 줄입니다. HPA는 behavior 정책대로 61초, 62초 간격으로 1개씩 줄었고, 세 영역 풀이 함께 2, 2, 2로 늘었으며, PRD의 강제 분산도 CAS와 충돌 없이 2, 2, 2를 만들었습니다. 단일 Deployment에서는 축소 뒤 영역 균등이 보장되지 않지만, 영역별 Deployment와 HPA로 나누면 축소 중에도 영역마다 하나 이상 남는다는 걸 TS6으로 확인했어요.
      아래 상자가 전체 결론입니다. 네트워크 22건과 스케일링 5건, 합쳐서 27건 PASS에 TS2 하나가 기록용 INFO입니다. 가운데 숫자 카드로 보시면 FAIL과 INCONCLUSIVE는 하나도 없습니다. 결국 PRD에 적힌 HPA behavior, 영역별 풀, 강제 분산은 그대로 써도 된다는 결론입니다. 그리고 영역당 최소 1개가 꼭 필요한 워크로드라면, 부하 분산과 Pod 수 손해를 감수하고 영역별 Deployment로 나누는 걸 선택지로 두시면 됩니다. 이상으로 Linux 관리 VM판 검증 결과 공유를 마치겠습니다. 질문 있으시면 편하게 주세요.
