# 스케일링 검증용 워크로드(scale 네임스페이스, 사용자 풀 userz1/2/3 에만 배치)
#   hpa-demo    : HPA 축소 속도(TS1), 축소 뒤 영역 분포(TS2 기록), 축소 때 삭제 Pod 선택(TS3 판정)
#   zone-fill   : Cluster Autoscaler 영역 균형(TS4). 분산 제약 없음
#   zone-spread : 영역 강제 분산 + Cluster Autoscaler(TS5)
#   hpa-z1/2/3  : 영역별 노드 풀(userz1/2/3)에 고정한 영역별 Deployment·HPA(TS6). 축소해도 영역마다 최소 1개.
#                 대신 HPA 가 영역마다 따로 돌아 영역 간 부하를 나누지 않고, 최소 Pod 수가 3의 배수가 된다.
# 세 워크로드 모두 pause 이미지라 CPU 를 실제로 쓰지 않는다. CPU 요청(requests)만으로 노드 자리를 차지한다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hpa-demo
  namespace: scale
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpa-demo
  namespace: scale
spec:
  # replicas 를 두지 않는다. Pod 수는 HPA 가 관리한다.
  # 여기에 값을 두면 02-apply.ps1 을 다시 실행할 때마다 Pod 수가 그 값으로 되돌아가 HPA 와 충돌한다.
  selector:
    matchLabels:
      app: hpa-demo
  template:
    metadata:
      labels:
        app: hpa-demo
    spec:
      serviceAccountName: hpa-demo
      nodeSelector:
        kubernetes.azure.com/mode: user   # 시스템 풀을 피하고 사용자 풀에만 배치
      # PRD 권장 YAML 과 같은 영역 강제 분산
      topologySpreadConstraints:
        - maxSkew: 1                       # 영역 간 Pod 수 차이를 1 이하로
          topologyKey: topology.kubernetes.io/zone
          # 차이가 1을 넘게 되면 배치하지 않고 Pending 으로 둔다(강제)
          whenUnsatisfiable: DoNotSchedule
          # 배치 가능한 노드가 있는 영역이 3개보다 적으면 최소 영역의 Pod 수를 0으로 보고 계산한다.
          # 그래서 한 영역에 노드가 없으면 나머지 영역에 몰리지 않고 Pending 이 되어 CAS 확장을 유도한다.
          minDomains: 3
          # taint 를 견디지 못하는 노드(CriticalAddonsOnly 가 걸린 시스템 노드)는 영역 계산에서 뺀다
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: hpa-demo
          # 롤링 업데이트 때 이전 ReplicaSet 의 Pod 를 빼고 같은 버전끼리만 분산을 계산한다
          matchLabelKeys:
            - pod-template-hash
      # 주의: 분산 제약은 Pod 를 배치할 때만 적용된다. 축소할 때 어느 Pod 를 지울지는 ReplicaSet 규칙이 정한다.
      # 그래서 TS3 에서 실제로 삭제된 Pod 를 ReplicaSet 삭제 규칙 예측과 대조한다.
      containers:
        - name: app
          image: registry.k8s.io/pause:3.9
          resources:
            requests:
              cpu: 100m                    # HPA 사용률 계산의 기준값. 요청이 없으면 HPA 가 계산하지 못한다
---
# HPA: 평소에는 최소 = 최대 = 5 로 Pod 5개를 고정한다.
# 검증 스크립트가 minReplicas 를 낮춰 축소를 일으킨다.
#   TS1  : 5 → 2. 1분에 1개씩 줄어드는지 확인(5,4,3,2, 간격 55초 이상이면 PASS)
#   TS3 : 5·9·12개 → 3(영역 수)을 각 2회. 삭제된 Pod 가 ReplicaSet 삭제 규칙 예측과 모두 같으면 PASS(분포는 기록)
#          이때 검증 스크립트가 maxReplicas 도 시작 개수로 잠시 올리고, 끝나면 5/5 로 되돌린다.
# pause 컨테이너는 CPU 를 쓰지 않아 사용률이 늘 목표(70%)보다 낮으므로, HPA 는 항상 최소값까지 줄이려 한다.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-demo
  namespace: scale
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hpa-demo
  minReplicas: 5
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      # stabilizationWindowSeconds 를 생략해 기본값 300초를 쓴다(이 검증의 판정 대상 아님)
      policies:
        - type: Pods               # Pod 개수 기준으로
          value: 1                 # 한 번에 최대 1개씩
          periodSeconds: 60        # 60초 동안
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zone-fill
  namespace: scale
---
# TS4: Cluster Autoscaler 의 영역 균형(balance-similar-node-groups=true) 검증용. 평소 0개, 분산 제약 없음.
# 검증 때 6개로 늘리면 들어갈 자리가 없는 Pod 가 Pending 이 되고, CAS 가 영역별 풀(userz1/2/3)을 함께 늘리는지 본다.
# CPU 800m 로 잡은 이유:
#   - 새 D2s_v5 노드(할당 가능 1900m, DaemonSet 약 410m)에는 1개만 들어간다(800 × 2 > 1490).
#   - 업무 Pod 가 있는 기존 노드(사용 약 800~930m)에도 1개 들어간다.
#   - 1200m 이면 기존 노드에 하나도 못 들어가 6개 모두 새 노드를 요구하고, 풀마다 최대(3대)에 닿아
#     균형 여부를 가릴 수 없다(3/3/3 으로 포화).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zone-fill
  namespace: scale
spec:
  replicas: 0
  selector:
    matchLabels:
      app: zone-fill
  template:
    metadata:
      labels:
        app: zone-fill
    spec:
      serviceAccountName: zone-fill
      nodeSelector:
        kubernetes.azure.com/mode: user
      containers:
        - name: app
          image: registry.k8s.io/pause:3.9
          resources:
            requests:
              cpu: 800m
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zone-spread
  namespace: scale
---
# TS5: PRD 권장 YAML 의 영역 강제 분산(hpa-demo 와 같은 제약)과 Cluster Autoscaler 를 함께 검증. 평소 0개.
# 6개로 늘리면 영역마다 정확히 2개씩 있어야 한다. 기존 노드(풀당 1대)에는 800m 가 1개씩만 들어가므로
# 남은 Pod 는 Pending 이 되고, CAS 가 Pod 가 들어갈 영역의 풀을 1대씩 늘려 노드 2/2/2, Pod 2/2/2 가 되기를 기대한다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zone-spread
  namespace: scale
spec:
  replicas: 0
  selector:
    matchLabels:
      app: zone-spread
  template:
    metadata:
      labels:
        app: zone-spread
    spec:
      serviceAccountName: zone-spread
      nodeSelector:
        kubernetes.azure.com/mode: user
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          minDomains: 3
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: zone-spread
          matchLabelKeys:
            - pod-template-hash
      containers:
        - name: app
          image: registry.k8s.io/pause:3.9
          resources:
            requests:
              cpu: 800m

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hpa-zonal
  namespace: scale
---
# TS6: 영역 1 전용 Deployment. 노드 풀 userz1(영역 1 고정)에만 배치해 축소 뒤에도 영역마다 최소 1개를 보장한다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpa-z1
  namespace: scale
spec:
  # replicas 를 두지 않는다. Pod 수는 HPA(hpa-z1)가 관리한다.
  selector:
    matchLabels:
      group: hpa-zonal
      zone: "1"
  template:
    metadata:
      labels:
        group: hpa-zonal
        zone: "1"
    spec:
      serviceAccountName: hpa-zonal
      nodeSelector:
        kubernetes.azure.com/agentpool: userz1   # 영역 1 에 고정된 사용자 풀
      containers:
        - name: app
          image: registry.k8s.io/pause:3.9
          resources:
            requests:
              cpu: 100m
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-z1
  namespace: scale
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hpa-z1
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
---
