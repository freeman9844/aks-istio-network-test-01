    notes: |
      앞 장 구성도 가운데에 있던 web과 bff 사이 호출을, 이번에는 정책 단위로 풀어 보겠습니다. 결론부터 말씀드리면 자기 BFF만 허용되고, 교차 호출, Gateway 우회, 평문 호출은 모두 막혔어요.
      왼쪽 위 카드 세 개가 실제 AuthorizationPolicy입니다. web-allow-ingress는 web 네임스페이스에서 tier가 web인 Pod에 걸려서 Ingress Gateway 서비스 계정에서 온 요청만 받아요. bff-a-allow는 web-a 서비스 계정만, bff-b-allow는 web-b 서비스 계정만 허용하고요. Istio에서는 ALLOW 정책이 하나라도 걸린 워크로드는 규칙에 안 맞는 요청을 403으로 거부하거든요. 그리고 principal은 mTLS 인증서에 든 서비스 계정 ID로 비교하기 때문에, 두 네임스페이스에 PeerAuthentication STRICT를 같이 걸었습니다.
      가운데 격자가 결과예요. Gateway에서 web으로 간 TN1은 200이었죠. web-a에서는 자기 bff-a가 200, bff-b는 403, Gateway를 건너뛰고 web-b를 바로 부른 TN10도 403이었습니다. web-b는 반대로 bff-b가 200, bff-a가 403이고요. 사이드카 없는 probe는 인증서가 없으니까 403까지 가지도 못하고 연결 단계에서 리셋됐어요. 그래서 TN9은 403이 아니라 000이 기대값입니다.
      오른쪽은 요청 한 건이 지나가는 순서예요. vm-appgw-sim이 Host 헤더 web-a.test로 LB에 보내면, Gateway와 VirtualService가 web-a로 넘깁니다. web-a에서는 Gateway 서비스 계정인지 보고요. bff-a에서는 web-a 서비스 계정인지 다시 확인합니다. 거부 테스트마다 허용 대조군을 짝지어 둬서 대조군이 실패하면 INCONCLUSIVE로 남기고요. 아래 오른쪽 TN13은 STRICT에서도 readinessProbe가 rewrite되어 네 개 모두 Ready였다는 확인입니다. 그럼 다음은 app 네임스페이스에서 bff별로 PE를 나눈 결과를 보겠습니다.
