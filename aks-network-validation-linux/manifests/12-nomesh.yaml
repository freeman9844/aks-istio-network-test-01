# 사이드카가 없는 클라이언트 probe(nomesh 네임스페이스에는 주입 레이블이 없다)
# 이 Pod 에서 bff-a 로 평문 HTTP 를 보내 STRICT mTLS 가 연결을 끊는지 확인한다(TN9, 기대: curl rc=56 연결 리셋).
# 서버로 쓰지 않으므로 Service 는 두지 않는다. curl 을 쓰려고 netshoot 이미지를 쓴다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: probe
  namespace: nomesh
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: nomesh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probe
  template:
    metadata:
      labels:
        app: probe
    spec:
      serviceAccountName: probe
      # 영역 분산 "가능하면"(ScheduleAnyway). 다른 워크로드와 형태를 맞추기 위한 설정
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: probe
      containers:
        - name: app
          image: nicolaka/netshoot:v0.13
          # 컨테이너가 종료되지 않도록 web·bff 와 같은 socat HTTP 서버를 띄워 둔다(요청은 받지 않음)
          command: ["socat"]
          args:
            - TCP-LISTEN:8080,fork,reuseaddr
            - 'SYSTEM:"printf ''HTTP/1.1 200 OK\r\nContent-Length: 2\r\n\r\nok''"'
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
