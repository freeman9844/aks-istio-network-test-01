    notes: |
      앞 장 표의 13건을 처음에 보여 드린 구성도 위에 다시 올려 볼게요. 숫자만 보면 어디서 어디로 간 호출인지 헷갈리기 쉽거든요. 오른쪽 위 초록 상자에 13건의 실측값을 모아 뒀고, 그림의 화살표가 각 호출의 경로입니다.
      왼쪽부터 보면, vm-appgw-sim에서 내부 LB 10.50.1.10으로 간 TN1은 200, vm-other에서 간 TN2는 종료 코드 28로 시간 초과였어요. vm-other 상자에 적은 것처럼 같은 VM에서 Blob PE로는 400, 즉 TLS 연결이 됐으니까 이 차단은 VM 문제가 아니라 노드 서브넷 NSG 때문입니다. 위쪽 snet-ingress에는 Deny 규칙이 있는데도 TN1이 200이라서, LB IP가 있는 서브넷의 NSG는 효과가 없다는 TN4도 함께 확인됐죠.
      가운데로 내려가면 Gateway를 지나 web-a, web-b로 들어오고, web에서 자기 bff로 간 TN5와 TN7은 200, 서로 바꾼 TN6과 TN8은 403입니다. 아래 nomesh의 probe는 사이드카가 없어서 bff-a로 평문을 보냈다가 종료 코드 56, 연결 리셋으로 끊겼고요. 사용자 풀 오른쪽 위에 적은 TN13은 STRICT mTLS에서도 readinessProbe가 rewrite되어 네 개 모두 Ready였다는 뜻이에요.
      오른쪽 데이터 계층에서는 web-a에서 Blob PE로 간 TN11이 000, bff-b에서 간 TN12가 400이었습니다. 둘 다 Blob 이름이 PE IP 10.50.2.4로 해석된 걸 먼저 확인하고 판정했어요. 그럼 가운데 Istio 인가 정책이 실제로 어떻게 생겼는지 다음 장에서 자세히 보겠습니다.
